name: One-time Git History Sanitization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    if: contains(github.event.head_commit.message, '[PURGE-HISTORY]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository history with a clean snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan sanitized-history
          git add -A
          git commit -m "Clean snapshot: exclude protected curriculum source and historical revisions"
          git push --force origin HEAD:main
